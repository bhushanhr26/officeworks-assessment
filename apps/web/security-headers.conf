# Included in every location: nginx drops server-level add_header once a location sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# __API_ORIGIN__ is replaced at image build time with the origin of VITE_API_URL.
# img-src allows https: because product images come from the data source's image host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' __API_ORIGIN__; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
